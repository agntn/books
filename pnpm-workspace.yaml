allowBuilds:
  "@google/genai": false
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
minimumReleaseAgeExclude:
  - typebox@1.3.18
  - "@agntn/*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0

catalogs:
  deps:
    "@agntn/tools": 0.2.1
    "@modelcontextprotocol/server": 2.2.0
    node-html-parser: 9.0.4
  dev:
    "@agntn/ox": 0.1.0
    "@earendil-works/pi-coding-agent": 1.0.4
    "@earendil-works/pi-tui": 1.0.4
    "@modelcontextprotocol/client": 2.2.0
    "@oh-my-pi/pi-coding-agent": 18.14.2
    "@types/node": 26.2.0
    ai: 7.0.127
    obuild: 0.4.43
    typebox: 1.3.34
    typescript: 7.0.2

cleanupUnusedCatalogs: true

overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Keeps pnpm 12's env document out of the lockfile. GitHub reads that one as zero dependencies.
pmOnFail: ignore
